a8\u8bba\u5f88\u4e45\uff0c\u4ed6\u53ef\u80fd\u5c31\u4e0d\u662f\u8fd9\u79cd\u903b\u8f91\uff0c\u6240\u4ee5\u4ed6\u7684\u90a3\u4e2a\u4ea7\u54c1\u6211\u4e5f\u6ca1\u6cd5\u7528\u3002\u6211\u53ef\u80fd\u4f1a\u6709\u81ea\u5df1\u7684\u4ea7\u54c1\u3002\n\n\u4e3a\u4ec0\u4e48\u6211\u4eec\u4e0d\u53d1\u5462\uff1f\u56e0\u4e3a\u6211\u4eec\u4e5f\u4e0d\u8ba4\u4e3a\u8fd9\u4e9b\u4e1c\u897f\u7684\u4ef7\u503c\u539a\u5ea6\u5f88\u9ad8\u3002\u6bcf\u4e2a\u4eba\u90fd\u6709\u81ea\u5df1\u7684\u60f3\u6cd5\u3001\u4f7f\u7528 coding \u5e94\u7528\u7684\u65b9\u6cd5\uff0c\u4ee5\u53ca\u65e5\u5e38\u9047\u5230\u7684\u95ee\u9898\uff0c\u90fd\u53ef\u4ee5\u81ea\u5df1\u7ed9\u81ea\u5df1 coding \u4e00\u4e2a\u3002\n\n\u66f2\u51ef\n\n\u6211\u5148\u95ee\u4e00\u4e0b\uff0c\u4f60\u4eec\u73b0\u5728\u521a\u624d\u8bb2\u7684\u8fd9\u4e9b\u81ea\u5df1 coding \u7684\u4e1c\u897f\uff0c\u771f\u7684\u4f1a\u6301\u7eed\u4f7f\u7528\u5417\uff1f\n\n\u4f1a\u554a\u3002\n\n\u66f2\u51ef\n\n\u4f60\u89c9\u5f97\u8fd9\u4f1a\u6210\u4e3a\u672a\u6765\u7684\u4e00\u79cd\u73b0\u8c61\u5417\uff1f\u672a\u6765\u6bcf\u4e2a\u4eba\u90fd\u4f1a\u505a\u5f88\u591a\u81ea\u5df1\u7684\u4ea7\u54c1\u7ed9\u81ea\u5df1\u7528\uff1f\n\n\u6211\u89c9\u5f97\u5b83\u662f\u4e00\u4e2a\u5206\u5e03\u7684\u95ee\u9898\uff0c\u672a\u6765\u7684\u5206\u5e03\u4f1a\u4e0d\u5747\u3002\u73b0\u5728\u5bf9\u4e8e\u4e00\u4e9b\u5de5\u5177\u7231\u597d\u8005\u6765\u8bf4\uff0c\u4ed6\u81ea\u5df1\u5e94\u8be5\u5df2\u7ecf\u7ed9\u81ea\u5df1\u505a\u5f88\u591a\u4e1c\u897f\u4e86\u3002\u6709\u4e00\u4e9b\u4eba\uff0c\u6bd4\u5982\u50cf\u6211\u4eec\u8fd9\u79cd\uff0c\u6211\u53ef\u80fd\u4f1a\u7528\u540c\u4e8b\u505a\u597d\u7684\u4e1c\u897f\uff0c\u4f46\u6211\u4e5f\u6709\u4e00\u4e9b\u4e2a\u6027\u5316\u9700\u6c42\uff0c\u53ef\u80fd\u4f1a\u81ea\u5df1\u505a\u70b9\u5c0f\u4e1c\u897f\uff0c\u53ea\u662f\u6570\u91cf\u6ca1\u6709\u5de5\u5177\u7231\u597d\u8005\u90a3\u4e48\u591a\u3002\n\n\u5de5\u5177\u7231\u597d\u8005\u53ef\u80fd\u9047\u5230\u4efb\u4f55\u4e00\u4e2a\u5c0f\u95ee\u9898\uff0c\u90fd\u4f1a\u505a\u4e00\u4e2a\u5c0f\u5de5\u5177\u3002\u4f46\u6211\u89c9\u5f97\uff0c\u8fd8\u662f\u4f1a\u6709\u76f8\u5f53\u591a\u6570\u7684\u4eba\u5728\u5e02\u573a\u4e0a\u53bb\u627e\u6bd4\u8f83\u6210\u719f\u3001\u6bd4\u8f83\u6807\u51c6\u5316\u7684\u4ea7\u54c1\uff0c\u56e0\u4e3a\u4ed6\u4eec\u6ca1\u6709\u90a3\u4e48\u591a\u7279\u522b\u75db\u7684\u95ee\u9898\u9700\u8981\u89e3\u51b3\u3002\n\n\u66f2\u51ef\n\n\u53e6\u5916\u6211\u597d\u5947\uff0c\u4f60\u4eec\u5b9e\u8df5\u8d77\u6765\uff0c\u522b\u4eba\u505a\u4e86\u4e00\u4e2a\u4e1c\u897f\uff0c\u4f60\u518d\u62ff\u8fc7\u6765\u6539\u4e00\u6539\uff0c\u8ba9\u5b83\u66f4\u9002\u5408\u81ea\u5df1\u7528\uff0c\u8fd9\u79cd\u6bd4\u4f8b\u9ad8\u5417\uff1f\u8fd8\u662f\u8bf4 AI coding \u5df2\u7ecf\u5f3a\u5230\uff0c\u6211\u5176\u5b9e\u4e5f\u4e0d\u7528\u6539\uff0c\u5e72\u8106\u5f88\u5feb\u81ea\u5df1\u641e\u4e00\u4e2a\u5c31\u884c\u4e86\uff1f\n\n\u9996\u5148\uff0c\u81ea\u5df1\u641e\u672c\u6765\u4e5f\u4e0d\u590d\u6742\u3002\u53ea\u8981\u628a\u57fa\u5efa\u505a\u597d\u5c31\u884c\u3002\u6211\u4eec\u5185\u90e8\u6709\u5f88\u591a\u57fa\u5efa\uff0c\u6bd4\u5982\u539f\u6765\u81ea\u5df1\u641e\u7684\u65f6\u5019\uff0c\u662f Excel \u52a0 Supabase\uff0c\u4f60\u8981\u89e3\u51b3\u540e\u7aef\u90e8\u7f72\u3001\u6570\u636e\u5e93\u8fd9\u4e9b\u95ee\u9898\u3002\u73b0\u5728\u6211\u4eec\u628a\u5b83\u4e00\u4f53\u5316\u4e86\uff0c\u63a5\u5230\u516c\u53f8\u81ea\u5df1\u7684\u540e\u7aef\u73af\u5883\uff0c\u53d1\u7ed9\u5b83\u4e00\u4e2a\u547d\u4ee4\uff0c\u57fa\u672c\u5c31\u7ed3\u675f\u4e86\u3002\n\n\u8fd9\u4e9b\u51c6\u5907\u597d\u4ee5\u540e\uff0c\u4f60\u60f3\u8d77\u4e00\u4e2a\u65b0\u9879\u76ee\u5c31\u5f88\u5feb\u4e86\u3002\u534a\u4e2a\u6708\u524d\u6211\u60f3\u5230\u4e00\u4e2a idea\uff0c\u665a\u4e0a 9 \u70b9\u591a\u5f00\u59cb coding\uff0c\u51cc\u6668 3 \u70b9\u5c31 coding \u5b8c\u4e86\uff0c\u81ea\u5df1\u5df2\u7ecf\u53ef\u4ee5\u7528\u4e86\u3002\u6240\u4ee5\u8fd9\u4ef6\u4e8b\u4e5f\u53d6\u51b3\u4e8e\u529f\u80fd\u590d\u6742\u5ea6\u3002\u5982\u679c\u6bd4\u8f83\u7b80\u5355\uff0c\u6211\u89c9\u5f97\u5f88\u5feb\u5c31\u80fd coding \u51fa\u6765\u3002\n\n\u81f3\u4e8e\u62ff\u6765\u6539\u4e00\u6539\u518d\u7528\uff0c\u8fd8\u662f\u8981\u770b\u54c1\u7c7b\u3002\u6709\u4e9b\u54c1\u7c7b\u53ef\u80fd\u6709\u4e2a\u6027\u5316\u9700\u6c42\uff0c\u4f60\u4f1a\u60f3\u81ea\u5df1\u6539\u6539\uff0c\u4f46\u6211\u4eec\u516c\u53f8\u76ee\u524d\u8fd8\u6ca1\u6709\u53d1\u751f\u8fc7\u8fd9\u79cd\u60c5\u51b5\u3002\u6240\u4ee5\uff0cAI \u505a\u51fa\u6765\u7684\u4ea7\u54c1\u5728\u4e2a\u4eba\u7aef\uff0c\u672a\u6765\u5bf9 fork \u7684\u9700\u6c42\u5176\u5b9e\u4e0d\u591a\u3002\n\n\u66f2\u51ef\n\n\u6211\u89c9\u5f97\u73b0\u5728\u4e0b\u8fd9\u4e2a\u7ed3\u8bba\u6709\u70b9\u65e9\u3002\u6838\u5fc3\u53d6\u51b3\u4e8e\u4f60\u662f\u4ec0\u4e48\u7c7b\u578b\u7684\u4ea7\u54c1\uff0c\u4f60\u662f\u600e\u4e48\u53d1\u73b0\u8fd9\u4e2a\u4ea7\u54c1\u7684\uff0c\u4ee5\u53ca\u4f60\u7684\u76ee\u7684\u662f\u4ec0\u4e48\u3002\u5982\u679c\u4f60\u7684\u76ee\u7684\u662f\u8ba9\u8fd9\u4e2a\u4e1c\u897f\u5bf9\u81ea\u5df1\u66f4\u597d\u7528\uff0c\u6211\u89c9\u5f97\u53ef\u80fd\u4e0d\u4e00\u5b9a\u662f\u4e00\u4e2a\u5f88\u5e7f\u6cdb\u7684\u4e8b\u60c5\u3002\u4f46\u5982\u679c fork \u662f\u4e00\u79cd\u5a31\u4e50\u4f53\u9a8c\uff0c\u6216\u8005\u975e\u751f\u4ea7\u529b\u5bfc\u5411\u7684\u4f53\u9a8c\uff0c\u90a3\u5c31\u4e0d\u597d\u8bf4\u4e86\u3002\n\n\u90a3\u4f60\u4eec\u516c\u53f8\u73b0\u5728\u7684\u4e3b\u7ebf\u5230\u5e95\u662f\u4ec0\u4e48\uff1f\u8fd9\u51e0\u4e2a\u6708\u79ef\u7d2f\u4e86\u4ec0\u4e48\uff1f\n\n\u611f\u53d7 AI \u9010\u6e10\u53d8\u5f3a\u7684\u8fc7\u7a0b\u3002\u6211\u4eec\u6ca1\u6709\u4ec0\u4e48\u79ef\u7d2f\uff0c\u4e5f\u4e0d\u80fd\u8bf4\u5b8c\u5168\u6ca1\u6709\u79ef\u7d2f\u3002\u66f4\u591a\u7684\u79ef\u7d2f\u8fd8\u662f\u5728\u4e8e\uff0c\u80fd\u4e0d\u80fd\u628a\u57fa\u5efa\u505a\u597d\uff0c\u8ba9\u6bcf\u4e2a\u4eba\u90fd\u80fd\u5feb\u901f\u505a\u4e00\u4e2a\u4ea7\u54c1\u3001\u5feb\u901f\u5b9e\u73b0\u81ea\u5df1\u7684\u60f3\u6cd5\uff0c\u5feb\u901f\u5229\u7528 coding agent \u5728\u751f\u4ea7\u73af\u8282\u4e2d\u63d0\u6548\u3002\n\n\u66f2\u51ef\n\n\u6211\u8bb0\u5f97\u4f60\u4e4b\u b\u7684\u8ff9\u8c61\u3002\u667a\u80fd\u6c34\u5e73\u4e0d\u65ad\u5f80\u4e0a\uff0ccoding \u80fd\u529b\u8d8a\u6765\u8d8a\u5f3a\u3002\n\n\u6240\u4ee5\uff0c\u6240\u6709\u64cd\u4f5c\u8ba1\u7b97\u8bbe\u5907\u7684\u4efb\u52a1\uff0c\u9996\u5148\u90fd\u53ef\u80fd\u7531\u4eba\u6765\u6307\u6325 coding agent \u53bb\u5b8c\u6210\uff0c\u5c24\u5176\u662f\u751f\u4ea7\u529b\u5f3a\u7684\u4efb\u52a1\u3002\u5b83\u4f1a\u505a\u5f97\u8d8a\u6765\u8d8a\u597d\uff0c\u751a\u81f3\u6bd4\u4eba\u5f3a\u3002\n\n\u90a3\u4ec0\u4e48\u6837\u7684\u4efb\u52a1\u662f\u5c5e\u4e8e\u8ba1\u7b97\u8bbe\u5907\u7684\uff1f\u4ece\u4e92\u8054\u7f51\u3001\u79fb\u52a8\u4e92\u8054\u7f51\u5f00\u59cb\uff0c\u5927\u5bb6\u628a\u5404\u4e2a\u884c\u4e1a\u90fd\u6570\u5b57\u5316\u4e86\u3002\u591a\u6570\u4fe1\u606f\u3001\u6570\u636e\u548c\u6d41\u7a0b\uff0c\u5176\u5b9e\u90fd\u5df2\u7ecf\u653e\u5230\u8ba1\u7b97\u8bbe\u5907\u4e0a\u53bb\u4e86\uff0c\u6240\u4ee5\u521b\u9020\u4e86\u5927\u91cf\u5c97\u4f4d\u3002\u6211\u89c9\u5f97\uff0c\u73b0\u5728\u7edd\u5927\u591a\u6570\u751f\u4ea7\u529b\u5df2\u7ecf\u662f\u7531\u8ba1\u7b97\u8bbe\u5907\u5e26\u6765\u7684\u3002\n\n\u4e0b\u4e00\u6b65\u53ef\u80fd\u5c31\u662f\u6a21\u578b\u516c\u53f8\u521b\u9020\u7edd\u5927\u591a\u6570\u4ef7\u503c\u3002\u6211\u4eca\u5929\u521a\u8ddf\u4eba\u804a\uff0c\u4ed6\u63d0\u4e86\u4e00\u4e2a\u5f88\u6709\u65b0\u610f\u7684\u89c2\u70b9\u3002\u8fd9\u4e2a\u5bf9\u6bd4\u542c\u8d77\u6765\u5f88\u4e0d\u5408\u7406\uff0c\u4f46\u53c8\u975e\u5e38\u5408\u7406\uff1a\u672a\u6765\u7684\u8f6f\u4ef6\u6709\u53ef\u80fd\u53d1\u5c55\u6210\u8ddf\u73b0\u5728\u7684\u786c\u4ef6\u4e00\u6837\u3002\u73b0\u5728\u7535\u8111\u53ef\u80fd\u5c31\u5341\u4e2a\u724c\u5b50\uff0c\u672a\u6765\u8f6f\u4ef6\u4e5f\u53ef\u80fd\u5c31\u662f 10 \u4e2a\u6a21\u578b\u6216\u8005\u4ea7\u54c1\u3002\n\n\u4ed6\u89c9\u5f97\uff0c\u672a\u6765\u6211\u4eec\u6bcf\u5929\u7528\u7684\u4e1c\u897f\uff0c\u5c31\u50cf\u4f60\u521a\u624d\u8bb2\u7684\uff0c\u53ef\u80fd\u53ea\u7528\u51e0\u4e2a coding agent\uff0c\u5176\u4ed6\u5404\u79cd SaaS \u548c\u8f6f\u4ef6\u90fd\u4e0d\u7528\u4e86\u3002\u6574\u4e2a\u8f6f\u4ef6\u4f7f\u7528\u7684\u573a\u666f\u548c\u884c\u4e3a\uff0c\u53ef\u80fd\u4f1a\u8ddf\u73b0\u5728\u4f7f\u7528\u786c\u4ef6\u4e00\u6837\u3002\n\n\u6211\u89c9\u5f97\u6838\u5fc3\u9996\u5148\u662f\uff0c\u6a21\u578b\u5e26\u6765\u7684\u667a\u80fd\u6c34\u5e73\u521b\u9020\u7684\u4ef7\u503c\u5b9e\u5728\u592a\u5927\u4e86\u3002\u6a21\u578b\u53c8\u662f\u4e00\u4e2a\u975e\u5e38\u91cd\u7684\u4e8b\u60c5\uff0c\u53ea\u6709\u6709\u9650\u7684\u4eba\u80fd\u505a\u3002\u6211\u4eec\u4eca\u5929\u751a\u81f3\u4e0d\u9700\u8981\u5355\u72ec\u8ba8\u8bba coding agent\uff0c\u56e0\u4e3a\u73b0\u5728\u7684 Codex\u3001Claude Code\uff0c\u672c\u8d28\u4e0a\u4e5f\u53ea\u662f\u6a21\u578b\u516c\u53f8\u7684\u5de5\u5177\u5bb9\u5668\u800c\u5df2\u3002\n\n\u6240\u4ee5\u6211\u89c9\u5f97\uff0c\u6700\u7ec8\u638c\u63e1\u4ef7\u503c\u7684\u5c31\u662f\u8fd9\u4e48\u591a\u5bb6\u6a21\u578b\u516c\u53f8\u3002\u8fd9\u4e9b\u6a21\u578b\u516c\u53f8\u521b\u9020\u6700\u5927\u7684\u4ef7\u503c\uff0c\u5f88\u6709\u53ef\u80fd\u5927\u591a\u6570\u751f\u4ea7\u529b\u5de5\u5177\u90fd\u4e0d\u5b58\u5728\u4e86\u3002\u4ee5\u540e\u53ef\u80fd\u6ca1\u6709 Photoshop\uff0c\u6ca1\u6709 IDE\uff0c\u4e5f\u6ca1\u6709\u5404\u4e2a\u9886\u57df\u7684\u4e13\u95e8\u5de5\u5177\uff0c\u4f60\u53ea\u8981\u7528\u81ea\u7136\u8bed\u8a00\u5c31\u53ef\u4ee5\u4e86\uff0c\u53ea\u9700\u8981\u4f7f\u7528\u6a21\u578b\u516c\u53f8\u51fa\u54c1\u7684 coding agent\u3002\n\n\u5b83\u53ef\u80fd\u4f1a\u6709\u5404\u79cd\u5404\u6837\u7684 coding agent\u3002\u56f4\u7ed5\u521b\u4f5c\u9886\u57df\uff0c\u53ef\u80fd\u662f\u4e00\u4e2a\u753b\u5e03\uff1b\u56f4\u7ed5\u975e\u521b\u4f5c\u9886\u57df\uff0c\u80af\u5b9a\u66f4\u50cf terminal\u3002\u6700\u8fd1 Claude Code \u4e0d\u662f\u8981\u53d1\u5e03\u4e00\u4e2a\u8ddf\u8bbe\u8ba1\u6709\u5173\u7684\u4e1c\u897f\u5417\uff1f\u6211\u89c9\u5f97\u6700\u7ec8\u5c31\u662f\u6a21\u578b\u516c\u53f8\u62ff\u8d70\u7edd\u5927\u591a\u6570\u4ef7\u503c\u3002\n\n\u6a21\u578b\u516c\u53f8\u62ff\u8d70\u7edd\u5927\u591a\u6570\u4 4f5c\u8005\u505a\u51fa\u4e86\u6709\u610f\u601d\u7684\u4e1c\u897f\uff0c\u4ed6\u4eec\u81ea\u5df1\u4f1a\u7528\uff0c\u4f46\u4ed6\u4eec\u53ef\u80fd\u4e0d\u4f1a\u53cd\u54fa\u8fd9\u4e2a\u7f51\u7edc\uff0c\u4e5f\u4e0d\u4f1a\u5bf9\u8fd9\u4e2a\u7f51\u7edc\u4ea7\u751f\u7279\u522b\u5927\u7684\u4ef7\u503c\u3002\u8fd9\u4e00\u70b9\u66f4\u50cf GitHub\u3002\n\n\u66f2\u51ef\n\n\u6240\u4ee5\u4f60\u89c9\u5f97\u5b83\u66f4\u50cf GitHub\uff1f\n\n\u6211\u89c9\u5f97\u4e5f\u4e0d\u592a\u4e00\u6837\u3002\u4ece\u5f71\u54cd\u529b\u7684\u89d2\u5ea6\uff0c\u6211\u5f53\u7136\u5e0c\u671b\u5b83\u80fd\u4ea7\u751f\u5f88\u5927\u7684\u5f71\u54cd\u529b\u3002\u6211\u8fd8\u662f\u89c9\u5f97\uff0c\u5f71\u54cd\u529b\u8db3\u591f\u5927\u7684\u8bdd\uff0c\u81ea\u7136\u4f1a\u4ea7\u751f\u6bd4\u8f83\u5927\u7684\u4ef7\u503c\u3002\n\n\u66f2\u51ef\n\n\u4f46\u4f60\u8fd9\u4e48\u8bf4\uff0c\u73b0\u5728\u505a\u7684\u662f\u4e00\u4e2a\u521b\u4f5c\u793e\u533a\uff0c\u5bf9\u5427\uff1f\u521b\u4f5c\u6700\u7ec8\u7684\u6d88\u8d39\u5728\u54ea\u91cc\uff1f\u4e5f\u5728\u8fd9\u4e2a\u793e\u533a\u91cc\u5417\uff1f\n\n\u8fd9\u4e2a\u793e\u533a\u91cc\u4e00\u5b9a\u4f1a\u6709\u4e00\u90e8\u5206\u6d88\u8d39\u3002\u4f60\u8bf4\u8981\u4e0d\u8981\u505a\u6d88\u8d39\uff0c\u672c\u8d28\u662f\u4e2a\u5bb9\u5668\u7684\u95ee\u9898\u3002\u4f46\u4f60\u505a\u5bb9\u5668\uff0c\u5b9e\u9645\u4e0a\u5c31\u662f\u5728\u9650\u5236\u6211\u521a\u624d\u8bf4\u7684\u521b\u4f5c\u8303\u56f4\u3002\n\n\u6240\u4ee5\u5bf9\u4e8e\u5bb9\u5668\u8fd9\u4ef6\u4e8b\u60c5\uff0c\u6211\u53cd\u800c\u89c9\u5f97\u4e0d\u4e00\u5b9a\u662f\u73b0\u5728\u8fd9\u4e2a\u65f6\u95f4\u70b9\u8981\u505a\u7684\u4e1c\u897f\u3002\n\n\u66f2\u51ef\n\n\u6211\u5728\u60f3\uff0c\u56e0\u4e3a\u6211\u4eec\u4e00\u76f4\u662f\u4e00\u7ea7\u5e02\u573a\u521b\u4e1a\u6295\u8d44\u8fd9\u6761\u8def\u5f84\u8d77\u6765\u7684\u3002\u5982\u679c\u540e\u9762\u6ca1\u6709\u8fd9\u79cd\u4e2d\u5fc3\u5316\u516c\u53f8\uff0c\u6700\u5927\u7684\u4ef7\u503c\u80af\u5b9a\u5728\u4e8c\u7ea7\u5e02\u573a\uff0c\u5e95\u4e0b\u5c31\u662f\u957f\u5c3e\u3002\u90a3\u         parent.append(document.createTextNode(value.slice(last,match.index)));
        if(match[0]==='[?]'){
          const unclear=document.createElement('span');unclear.className='unclear';unclear.textContent='（名称听辨不清）';unclear.title='第三方转写原文用 [?] 标记，此处名称尚未核对音频。';parent.append(unclear);
        }else{
          const item=terms.get(match[0].toLowerCase()),key=item?.term.toLowerCase();
          if(!item||highlighted.has(key))parent.append(document.createTextNode(match[0]));
          else{
            highlighted.add(key);
            const term=document.createElement('button');term.className='term';if(item.type==='名称待核'){term.classList.add('uncertain-term');if(!uncertainLabeled.has(item.term)){term.classList.add('labeled');uncertainLabeled.add(item.term)}}term.textContent=match[0];term.setAttribute('aria-label',item.type==='名称待核'?'查看 '+match[0]+' 的名称待核说明':'查看 '+match[0]+' 的简短解释');
            term.addEventListener('click',event=>{event.stopPropagation();state.lastTerm=term;$('term-title').textContent=match[0];$('term-type').textContent=item.type;$('term-detail').textContent=item.detail;const source=$('term-source');source.hidden=!item.source;source.href=item.source||'#';source.textContent=item.sourceLabel||'了解更多 ↗';$('concept').hidden=false;$('concept-close').focus()});parent.append(term);
          }
        }
        last=match.index+match[0].length;
      }
      parent.append(document.createTextNode(value.slice(last)));
    }
    async function transcriptHash(markdown){const bytes=new TextEncoder().encode(markdown),digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('')}
    function seekTo(time,label,play=false){audio.currentTime=time;state.following=true;renderChapter(true);$('audio-state').textContent=label;if(play&&audio.paused)audio.play().catch(()=>$('audio-state').textContent='已定位到 '+fmt(time)+' · 请点播放')}
    function renderTranscript(markdown,alignment){
      box.replaceChildren();
      state.aligned=Boolean(alignment);state.turns=[];state.uncertainIntervals=[];state.currentReviewTurn=null;state.activeTurn=-1;uncertainLabeled=new Set();
      const intro=document.createElement('div');intro.className='intro-note';intro.textContent=episode.intro;box.append(intro);
      let speaker='说话者待核对',lastRenderedSpeaker='',count=0;
      for(const raw of markdown.split(/\n\s*\n/)){
        const part=raw.trim();if(!part)continue;
        if(episode.speakers.includes(part)){speaker=part;lastRenderedSpeaker='';continue}
        if(part.startsWith('### ')){
          const heading=part.slice(4).trim(),el=document.createElement('div');
          el.className='chapter-divider';el.dataset.heading=heading;
          const next=alignment?.turns[count],time=next?.confidence>=0.4?next.time:undefined;
          if(time!==undefined){
            el.dataset.start=String(time);
            const button=document.createElement('button');button.className='chapter-jump';
            button.textContent=fmt(time)+' · 文稿小节：'+heading+' ↗';
            button.setAttribute('aria-label','跳至文稿小节 '+heading+'，'+fmt(time));
            button.addEventListener('click',()=>seekTo(time,'已跳转到文稿小节 '+fmt(time),true));el.append(button)
          }else el.textContent='文稿小节 · '+heading;
          box.append(el);lastRenderedSpeaker='';continue;
        }
        const gap=part.startsWith('[[GAP:');
        const turn=document.createElement('div'),meta=document.createElement('div'),body=document.createElement('div');
        turn.className='turn'+(gap?' gap':speaker==='说话者待核对'?' unknown':'')+(speaker===lastRenderedSpeaker?' same-speaker':'');
        meta.className='turn-meta';meta.textContent=gap?'原文缺稿':speaker;body.className='turn-body';
        if(gap)body.textContent='此处约 13 秒未收录在第三方文稿中 · 点击听原音频';else addTermText(body,part);
        turn.append(meta,body);box.append(turn);
        const timing=alignment?.turns[count];
        if(timing){
          if(timing.confidence>=0.4&&timing.end>timing.time&&!timing.reviewRequired){
            turn.dataset.start=String(timing.time);state.turns.push(turn);
            turn.classList.add('clickable');turn.tabIndex=0;
            turn.setAttribute('aria-label','跳至 '+fmt(timing.time)+' 的段落');
            turn.addEventListener('click',event=>{if(!event.target.closest('.term'))seekTo(timing.time,'已跳转到段落 '+fmt(timing.time),true)});
            turn.addEventListener('keydown',event=>{if(event.target===turn&&(event.key==='Enter'||event.key===' ')){event.preventDefault();seekTo(timing.time,'已跳转到段落 '+fmt(timing.time),true)}})
          }else{turn.classList.add('review-required');meta.textContent=(gap?'原文缺稿 · ':'')+'定位待核'+(timing.reviewReason?' · '+timing.reviewReason:'');turn.title='这段时间或文字仍待核，暂不提供精确跳转';if(Number.isFinite(timing.time)&&timing.end>timing.time)state.uncertainIntervals.push({time:timing.time,end:count===alignment.turns.length-1?Infinity:timing.end,element:turn})}
        }
        lastRenderedSpeaker=gap||turn.classList.contains('review-required')?'':speaker;count++;
      }
      state.ready=count>0;renderChapter(true);
      if(state.following&&!state.aligned)requestAnimationFrame(()=>followChapter(true));
      $('tap-hint').textContent=state.aligned?'点段落跳转 · 点划线词看解释 · 时间可能有误差':'点划线词看解释 · 可使用 Timeline 章节跳转';
      $('audio-state').textContent=state.aligned?episode.contentNote:'第三方转写有误 · 以音频为准';
    }
    async function loadTranscript(){try{const [response,timesResponse,glossaryResponse]=await Promise.all([readData(episode.transcript),readData(episode.times),readData(episode.glossary).catch(()=>null)]);if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!data.transcript_md)throw Error('缺少文字稿');episode.transcriptSource=data.source;try{if(glossaryResponse?.ok){const glossary=await glossaryResponse.json();if(Array.isArray(glossary.entries))configureTerms(glossary.entries)}}catch(error){console.warn('词表载入失败，文字稿继续显示',error)}let alignment=null;if(timesResponse.ok){const candidate=await timesResponse.json();if(candidate.turns.length>0&&(bundled||candidate.source_sha256===await transcriptHash(data.transcript_md)))alignment=candidate}renderTranscript(data.transcript_md,alignment)}catch(error){box.innerHTML='';const p=document.createElement('p'),link=document.createElement('a');p.className='loading';p.textContent='文字稿暂时无法载入。可在原网站阅读，音频与章节跳转仍可使用。 ';link.href=episode.official;link.target='_blank';link.rel='noopener';link.textContent='打开文字稿';p.append(link);box.append(p);$('tap-hint').textContent='文字稿暂时无法载入';$('audio-state').textContent='文字稿加载失败 · 真实音频可用'}}
    async function loadEpisode(){try{
      const response=await readData('waiting-episode-manifest.json');if(!response.ok)throw Error('HTTP '+response.status);
      const manifest=await response.json();episodeList=manifest.episodes;
      const requested=new URL(location.href).searchParams.get('episode');episode=episodeList.find(item=>item.id===requested)||episodeList[0];
      if(!episode||!Array.isArray(episode.chapters)||!episode.chapters.length)throw Error('节目内容包不完整');
      chapters=episode.chapters;
      const picker=$('episode-picker');picker.replaceChildren();for(const item of episodeList){const option=document.createElement('option');option.value=item.id;option.textContent=item.label;picker.append(option)}picker.value=episode.id;
      $('episode-title').textContent=episode.title;$('episode-subtitle').textContent=' · '+episode.subtitle;$('episode-cover').textContent=episode.cover;
      $('episode-official').href=episode.official;
      document.title='Waiting · '+episode.title;
      $('episode-count').textContent='MVP · '+episodeList.length+' 集';
      $('prototype-note').textContent=bundled?'单文件测试版 · 页面数据已内置，播放真实音频仍需联网。':'本地 MVP · '+episodeList.length+' 集真实音频与第三方文稿；尚未逐字听校。';
      try{savedPlayback=JSON.parse(sessionStorage.getItem('waiting-playback-'+episode.id)||'null')}catch(error){savedPlayback=null}
      renderChapter(true);audio.src=episode.audio;audio.load();loadTranscript();
    }catch(error){box.replaceChildren();const message=document.createElement('p');message.className='loading';message.textContent='节目内容包载入失败，请刷新页面。';box.append(message);$('audio-state').textContent='内容载入失败'}}
    function hideTimeline(){$('timeline').hidden=true;$('timeline-trigger').focus()}
    function hideConcept(){$('concept').hidden=true;state.lastTerm?.focus()}
    $('summary-toggle').addEventListener('click',()=>{state.expanded=!state.expanded;$('summary-detail').hidden=!state.expanded||!chapters[state.chapter]?.detail;$('summary-toggle').textContent=state.expanded?'收起提要 ⌃':'展开提要 ⌄';$('summary-toggle').setAttribute('aria-expanded',String(state.expanded));if(state.following)requestAnimationFrame(()=>state.aligned?followActiveTurn(true):followChapter(true))});
    $('view-mode').addEventListener('click',()=>{const top=box.getBoundingClientRect().top,anchor=state.turns.find(el=>el.getBoundingClientRect().bottom>top),offset=anchor?anchor.getBoundingClientRect().top-top:0;compact=!compact;applyViewMode();if(state.following){if(state.aligned)followActiveTurn(true);else followChapter(true)}else if(anchor)box.scrollTop+=anchor.getBoundingClientRect().top-top-offset});
    $('timeline-trigger').addEventListener('click',()=>{$('timeline').hidden=false;$('timeline-close').focus()});$('timeline-close').addEventListener('click',hideTimeline);$('timeline').addEventListener('click',e=>{if(e.target===$('timeline'))hideTimeline()});$('concept-close').addEventListener('click',hideConcept);
    $('return-current').addEventListener('click',()=>{state.following=true;updateFollow();if(state.aligned){if(state.currentReviewTurn)followTurn(state.currentReviewTurn,true);else if(state.activeTurn<0)box.scrollTo({top:0,behavior:'auto'});else followActiveTurn(true)}else followChapter(true)});for(const event of ['wheel','touchmove'])box.addEventListener(event,()=>{state.following=false;updateFollow()},{passive:true});box.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End'].includes(e.key)){state.following=false;updateFollow()}});
    $('play').addEventListener('click',async()=>{if(audio.paused){try{await audio.play()}catch(error){$('audio-state').textContent='音频未能播放，请再点一次或打开节目原页'}}else audio.pause()});$('rewind').addEventListener('click',()=>{audio.currentTime=Math.max(0,audio.currentTime-15)});$('forward').addEventListener('click',()=>{audio.currentTime=Math.min(audio.duration||episode.duration,audio.currentTime+15)});$('speed').addEventListener('click',()=>{const speeds=[1,1.5,2],next=speeds[(speeds.indexOf(audio.playbackRate)+1)%speeds.length];audio.playbackRate=next;$('speed').textContent=next+'×';$('speed').setAttribute('aria-label','播放速度 '+next+' 倍');rememberPlayback()});$('progress').addEventListener('input',e=>{audio.currentTime=Number(e.target.value);state.following=true;updateFollow();renderChapter(true);rememberPlayback()});
    audio.addEventListener('loadedmetadata',()=>{if(savedPlayback&&Number.isFinite(savedPlayback.time)&&savedPlayback.time>0&&savedPlayback.time<audio.duration-1){audio.currentTime=savedPlayback.time}if(savedPlayback&&[1,1.5,2].includes(savedPlayback.rate)){audio.playbackRate=savedPlayback.rate;$('speed').textContent=savedPlayback.rate+'×';$('speed').setAttribute('aria-label','播放速度 '+savedPlayback.rate+' 倍')}renderChapter(true);$('audio-state').textContent=state.aligned?'段落时间已载入 · 可点击试听':'真实音频已就绪 · 点击播放'});audio.addEventListener('timeupdate',()=>{renderChapter();rememberPlayback()});audio.addEventListener('seeked',()=>{renderChapter(true);rememberPlayback()});audio.addEventListener('play',()=>{$('play').textContent='Ⅱ';$('play').setAttribute('aria-label','暂停真实音频')});audio.addEventListener('pause',()=>{$('play').textContent='▶';$('play').setAttribute('aria-label','播放真实音频');rememberPlayback()});audio.addEventListener('error',()=>{$('audio-state').textContent='音频加载失败，请打开节目原页'});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('concept').hidden)hideConcept();else if(!$('timeline').hidden)hideTimeline()}});
    $('episode-picker').addEventListener('change',event=>{rememberPlayback();const url=new URL(location.href);url.searchParams.set('episode',event.target.value);location.href=url.href});
    applyViewMode();loadEpisode();
  </script>
